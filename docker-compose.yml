name: ledger

x-ledger: &ledger
  image: ledger:local
  environment: &ledger-env
    SPRING_PROFILES_ACTIVE: docker
    LEDGER_DB_URL: jdbc:mysql://mysql:3306/ledger?connectionTimeZone=UTC
    LEDGER_DB_USER: ledger
    LEDGER_DB_PASSWORD: ledger
    LEDGER_KAFKA_BOOTSTRAP: kafka:9092
  depends_on:
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    command: >-
      --default-time-zone=+00:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --transaction-isolation=READ-COMMITTED
      --skip-log-bin
    environment:
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uledger", "-pledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ledger-local-cluster-0001
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  ledger-1:
    <<: *ledger
    build: .
    environment:
      <<: *ledger-env
      LEDGER_INSTANCE_ID: ledger-1
    ports:
      - "127.0.0.1:8081:8080"

  ledger-2:
    <<: *ledger
    depends_on:
      ledger-1:
        condition: service_started
    environment:
      <<: *ledger-env
      LEDGER_INSTANCE_ID: ledger-2
    ports:
      - "127.0.0.1:8082:8080"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      ledger-1:
        condition: service_healthy
      ledger-2:
        condition: service_healthy

volumes:
  mysql-data:
  kafka-data:
