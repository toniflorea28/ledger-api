spring:
  application:
    name: ledger
  datasource:
    url: ${LEDGER_DB_URL:jdbc:mysql://localhost:3306/ledger?connectionTimeZone=UTC}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:20}
      # READ COMMITTED on purpose: the posting path takes explicit row locks
      # (SELECT ... FOR UPDATE) and we do not want InnoDB gap locks on inserts.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: ledger
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,kafka
  tracing:
    sampling:
      probability: 1.0

ledger:
  instance-id: ${LEDGER_INSTANCE_ID:local}
  idempotency:
    ttl: PT24H
    sweep-interval: PT10M
  consumer:
    concurrency: 3
  outbox:
    enabled: true
    poll-interval: PT0.5S
    lease-ttl: PT15S
    batch-size: 200
    send-timeout: PT10S
  topics:
    payment-settled: payments.settled
    payment-settled-dlt: payments.settled.dlt
    transaction-recorded: ledger.transaction-recorded.v1
